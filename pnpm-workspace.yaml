packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true

catalog:
  # apps
  dotenv: ^17.4.2
  lucide-react: ^1.21.0
  react: ^19.2.7
  react-dom: ^19.2.7
  zod: ^4.4.3

  # dev
  '@tailwindcss/postcss': ^4.3.1
  '@types/node': ^26.0.1
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  chalk: ^5.6.2
  commander: ^15.0.0
  esbuild: 0.28.1
  postcss: ^8.5.15
  tailwindcss: ^4.3.1
  tsx: ^4.22.4
  typescript: 6.0.3
  vitest: ^4.1.9

minimumReleaseAgeExclude:
  - '@nowly/sdk@1.2.2'

onlyBuiltDependencies:
  - sharp
