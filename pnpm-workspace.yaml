  dotenv: ^17.4.2
  lucide-react: ^0.564.0
  react: ^19.2.7
  react-dom: ^19.2.7
  zod: ^3.25.76

  # dev
  '@tailwindcss/postcss': ^4.3.1
  '@types/node': ^22.20.0
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  chalk: ^5.6.2
  commander: ^13.1.0
  esbuild: 0.24.2
  postcss: ^8.5.15
  tailwindcss: ^4.3.1
  tsx: ^4.22.4
  typescript: 5.7.3
  vitest: ^3.2.6

onlyBuiltDependencies:
  - sharp
