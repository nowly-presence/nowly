packages:
  - apps/*
  - packages/*
  # Separate repositories cloned locally by `pnpm repos`; each has its own lockfile.
  - "!packages/sdk"
  - "!packages/cli"
  - "!packages/presences"
  - "!packages/internal-cli"

allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  simple-git-hooks: true

minimumReleaseAge: 0

onlyBuiltDependencies:
  - sharp
