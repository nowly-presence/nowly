name: Presence Date Backfill

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the dry-run dates after review"
        required: true
        default: false
        type: boolean

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.API_URL || 'https://api.nowly.me' }}
      API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
    steps:
      # The internal CLI reads presences from ../../packages/presences, so both keep their old paths.
      - uses: actions/checkout@v7
        with:
          repository: nowly-presence/presences
          fetch-depth: 0
          path: packages/presences

      - uses: actions/checkout@v7
        with:
          repository: nowly-presence/internal-cli
          token: ${{ secrets.INTERNAL_CLI_PAT }}
          path: packages/internal-cli

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install internal-cli dependencies
        working-directory: packages/internal-cli
        run: npm install

      - name: Preview publication dates
        working-directory: packages/internal-cli
        run: npx tsx index.ts presence backfill-dates --dry-run

      - name: Apply publication dates
        if: inputs.apply == true
        working-directory: packages/internal-cli
        run: npx tsx index.ts presence backfill-dates
