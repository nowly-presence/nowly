name: Test API and telemetry

on:
  push:
    branches: [stable]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git submodule init && git submodule update packages/sdk packages/cli packages/presences
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nowly/api prisma:generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/nowly
      - run: pnpm --filter @nowly/api test
      - run: pnpm --filter @nowly/telemetry test
      - run: pnpm --filter @nowly/telemetry typecheck
