name: Canary Extension

on:
  push:
    branches: [stable]
    paths:
      - "apps/extension/**"
  workflow_dispatch:

concurrency:
  group: canary-extension
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # extension:sync builds ../../apps/extension, so the private CLI keeps its old path.
      - uses: actions/checkout@v7
        with:
          repository: nowly-presence/internal-cli
          token: ${{ secrets.INTERNAL_CLI_PAT }}
          path: packages/internal-cli

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install internal-cli dependencies
        working-directory: packages/internal-cli
        run: npm install

      - name: Upload Canary zip to CDN
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'nowly' }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || 'https://cdn.nowly.me' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        working-directory: packages/internal-cli
        run: npx tsx index.ts extension:sync
