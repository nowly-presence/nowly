name: Canary Extension

on:
  push:
    branches: [stable]
    paths:
      - "apps/extension/**"
  workflow_dispatch:

concurrency:
  group: canary-extension
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: git submodule init && git submodule update packages/sdk packages/cli packages/presences packages/internal-cli

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Upload Canary zip to CDN
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'nowly' }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL || 'https://cdn.nowly.me' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: pnpm --filter @nowly/internal-cli exec tsx index.ts extension:sync
