name: Lint

on:
  push:
    branches: [stable]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: git submodule init && git submodule update packages/sdk packages/cli packages/presences
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nowly/web lint
      - run: pnpm --filter @nowly/docs lint
      - run: pnpm --filter @nowly/extension lint
