name: Presence Update

on:
  pull_request:
    types: [closed]
    paths:
      - "packages/presences/src/*/*/**"

jobs:
  update:
    if: >
      github.event.pull_request.merged == true
      && contains(github.event.pull_request.labels.*.name, 'presence')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git submodule update --init --recursive packages/sdk packages/cli packages/presences packages/internal-cli

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install

      - name: Detect changed presences
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          FILES=$(git diff --name-only --diff-filter=AMR "$BASE"..."$HEAD" -- "packages/presences/src/*/*/**" 2>/dev/null)
          SLUGS=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            letter=$(echo "$file" | cut -d'/' -f4)
            name=$(echo "$file" | cut -d'/' -f5)
            meta_path="packages/presences/src/$letter/$name/metadata.json"
            [ -f "$meta_path" ] || continue

            slug=$(echo "$name" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
            printf '%s\n' "$SLUGS" | grep -qx "$slug" && continue
            SLUGS="$SLUGS$slug"$'\n'
          done <<< "$FILES"

          {
            echo "slugs<<EOF"
            printf '%s' "$SLUGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -z "$SLUGS" ]; then
            echo "No presences to sync"
          else
            echo "Changed presences:"
            printf '%s' "$SLUGS"
          fi

      - name: Push changed presences
        if: steps.changed.outputs.slugs != ''
        env:
          API_URL: ${{ secrets.API_URL || 'https://api.nowly.me' }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'nowly' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          github_display_name() {
            local login="$1"
            local name
            name=$(gh api "users/$login" --jq '.name // .login' 2>/dev/null || true)
            if [ -z "$name" ] || [ "$name" = "null" ]; then
              name="$login"
            fi
            printf '%s' "$name"
          }

          PR_AUTHOR_NAME=$(github_display_name "$PR_AUTHOR")
          PR_RELEASE_AUTHOR="$PR_AUTHOR_NAME:$PR_AUTHOR"
          RELEASE_AUTHORS=""
          SEEN_RELEASE_AUTHORS=$'\n'
          while IFS=$'\t' read -r name email; do
            [ -n "$name" ] || continue
            github=$(printf '%s' "$email" | sed -nE 's/^[0-9]+\+([^@]+)@users\.noreply\.github\.com$/\1/p')
            if [ -n "$github" ] && { [ "$name" = "$github" ] || [ "$name" = "$email" ]; }; then
              name=$(github_display_name "$github")
            fi
            value="$name"
            [ -n "$github" ] && value="$value:$github"

            case "$SEEN_RELEASE_AUTHORS" in
              *$'\n'"$value"$'\n'*) continue ;;
            esac

            SEEN_RELEASE_AUTHORS="$SEEN_RELEASE_AUTHORS$value"$'\n'
            if [ -z "$RELEASE_AUTHORS" ]; then
              RELEASE_AUTHORS="$value"
            else
              RELEASE_AUTHORS="$RELEASE_AUTHORS,$value"
            fi
          done < <(git log --format='%an	%ae' "$BASE"..."$HEAD" 2>/dev/null)

          if [ -z "$RELEASE_AUTHORS" ]; then
            RELEASE_AUTHORS="$PR_RELEASE_AUTHOR"
          fi

          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            pnpm admin push "$slug" \
              --patch \
              --source pr \
              --base "$BASE" \
              --head "$HEAD" \
              --pr "#$PR_NUMBER" \
              --pr-title "$PR_TITLE" \
              --author "$PR_RELEASE_AUTHOR" \
              --authors "$RELEASE_AUTHORS"
          done <<< "${{ steps.changed.outputs.slugs }}"
