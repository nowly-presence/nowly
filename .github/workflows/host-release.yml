name: Host Release

on:
  push:
    tags:
      - "native-v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Host version to release, e.g. 1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#native-v}"
          else
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#native-v}"
            VERSION="${VERSION#v}"
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "Error: Invalid host version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/native/go.mod

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Test Nowly Host
        working-directory: apps/native
        run: go test ./...

      - name: Build Nowly Host
        working-directory: apps/native
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $ldflags = "-X nowly.client/native/internal/contract.HostVersion=${{ needs.version.outputs.version }}"

          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags $ldflags -o dist/nowly-host.exe ./cmd/host

          $env:GOOS = "linux"
          $env:GOARCH = "amd64"
          go build -ldflags $ldflags -o dist/nowly-host-linux ./cmd/host

      - name: Build Windows installer
        working-directory: apps/native
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer.iss /DAPP_VERSION=${{ needs.version.outputs.version }}

      - name: Build portable archives
        working-directory: apps/native
        shell: pwsh
        run: |
          Compress-Archive -Path dist/nowly-host.exe -DestinationPath dist/nowly-windows.zip -Force

          New-Item -ItemType Directory -Force -Path dist/linux/scripts | Out-Null
          Copy-Item dist/nowly-host-linux dist/linux/nowly-host-linux
          Copy-Item scripts/install-linux.sh dist/linux/scripts/install-linux.sh
          Copy-Item scripts/uninstall-linux.sh dist/linux/scripts/uninstall-linux.sh
          tar -czf dist/nowly-linux.tar.gz -C dist/linux .

      - name: Publish to CDN
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'nowly' }}
        run: >
          pnpm admin host:publish
          --release-version ${{ needs.version.outputs.version }}
          --installer "${{ github.workspace }}/apps/native/dist/NowlySetup.exe"
          --portable "${{ github.workspace }}/apps/native/dist/nowly-windows.zip"
          --linux "${{ github.workspace }}/apps/native/dist/nowly-linux.tar.gz"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nowly-host-windows
          path: |
            apps/native/dist/NowlySetup.exe
            apps/native/dist/nowly-windows.zip
            apps/native/dist/nowly-linux.tar.gz

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: apps/native/go.mod

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Nowly Host
        working-directory: apps/native
        run: go test ./...

      - name: Import Developer ID certificate
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Store notarytool credentials
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          xcrun notarytool store-credentials nowly-notary \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          echo "NOTARY_PROFILE=nowly-notary" >> "$GITHUB_ENV"

      - name: Build macOS release
        working-directory: apps/native
        run: |
          bash scripts/macos-release.sh "${{ needs.version.outputs.version }}"

      - name: Publish DMG to CDN
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'nowly' }}
        run: |
          if [ -n "${R2_ACCESS_KEY_ID:-}" ]; then
            pnpm admin host:publish \
              --release-version ${{ needs.version.outputs.version }} \
              --macos-dmg "${{ github.workspace }}/apps/native/releases/${{ needs.version.outputs.version }}/NowlyHost-macos.dmg"
          else
            echo "R2 credentials not configured — skipping CDN publish"
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: nowly-host-macos
          path: apps/native/releases/${{ needs.version.outputs.version }}/NowlyHost-macos.dmg

  release:
    needs: [version, windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nowly-host-windows

      - uses: actions/download-artifact@v4
        with:
          name: nowly-host-macos

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-v${{ needs.version.outputs.version }}
          name: Nowly Host v${{ needs.version.outputs.version }}
          files: |
            NowlySetup.exe
            nowly-windows.zip
            nowly-linux.tar.gz
            NowlyHost-macos.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
